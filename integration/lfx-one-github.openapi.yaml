# Operations for the custom Guild integration that acts as the `lfx-one`
# GitHub account. It holds the 21 operations the review agent uses: the 12
# it first used from `guildai~github`, a reaction, four reads for CI
# checks and required checks, three for the hourly sweep (an issue
# search, and adding and removing the one pending label), and a git tree
# read for file sizes before reads (1.0.6). The credential is a
# fine-grained token owned by `lfx-one`, connected with
# `guild integration connect`. Never put the token in this file.
#
# Guild does not enforce `enum` values in a request (probe on 1.0.5,
# 2026-11-03): an enum here documents the intended value only. Where a
# value must be fixed, put it in the path, as `issues_remove_label` does.
#
# Guild names each tool `<service>_<operation id>`, so the tools are
# `lfx_one_github_<operation id>`. guild.yaml and PROMPT.md use those names.

openapi: 3.0.3
info:
  title: LFX One GitHub
  version: 1.0.6
  description: GitHub REST operations the LFX review agent performs as lfx-one.
servers:
  - url: https://api.github.com

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Fine-grained token for the lfx-one account.
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema: { type: string }
    repo:
      name: repo
      in: path
      required: true
      schema: { type: string }
    pull_number:
      name: pull_number
      in: path
      required: true
      schema: { type: integer }
    issue_number:
      name: issue_number
      in: path
      required: true
      schema: { type: integer }
    comment_id:
      name: comment_id
      in: path
      required: true
      schema: { type: integer }
    per_page:
      name: per_page
      in: query
      schema: { type: integer, maximum: 100 }
    page:
      name: page
      in: query
      schema: { type: integer }
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema: { type: object }
    OkList:
      description: Successful response, a JSON array
      content:
        application/json:
          schema: { type: array, items: { type: object } }
    ReviewList:
      description: >-
        Reviews on a pull request. Lists only the fields PROMPT.md reads, in
        case Guild trims a response to its schema.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id: { type: integer }
                state: { type: string }
                body: { type: string, nullable: true }
                html_url: { type: string }
                commit_id: { type: string, nullable: true }
                submitted_at: { type: string, nullable: true }
                user:
                  type: object
                  nullable: true
                  properties:
                    login: { type: string }
    ReviewCommentList:
      description: >-
        Inline review comments on a pull request. Lists only the fields
        PROMPT.md reads, in case Guild trims a response to its schema.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id: { type: integer }
                pull_request_review_id: { type: integer, nullable: true }
                in_reply_to_id: { type: integer, nullable: true }
                body: { type: string }
                path: { type: string }
                line: { type: integer, nullable: true }
                start_line: { type: integer, nullable: true }
                original_line: { type: integer, nullable: true }
                side: { type: string, nullable: true }
                commit_id: { type: string }
                html_url: { type: string }
                created_at: { type: string }
                updated_at: { type: string }
                user:
                  type: object
                  nullable: true
                  properties:
                    login: { type: string }

paths:
  /repos/{owner}/{repo}/pulls/{pull_number}:
    get:
      operationId: pulls_get
      summary: Get a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/pulls/{pull_number}/files:
    get:
      operationId: pulls_list_files
      summary: List files changed in a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/pulls/{pull_number}/commits:
    get:
      operationId: pulls_list_commits
      summary: List commits in a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/pulls/{pull_number}/reviews:
    get:
      operationId: pulls_list_reviews
      summary: List reviews on a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/ReviewList" }
    post:
      operationId: pulls_create_review
      summary: Submit a review on a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commit_id: { type: string }
                body: { type: string }
                event:
                  type: string
                  enum: [APPROVE, REQUEST_CHANGES, COMMENT]
                comments:
                  type: array
                  items: { type: object }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/pulls/{pull_number}/comments:
    get:
      operationId: pulls_list_review_comments
      summary: List review comments on a pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/pull_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/ReviewCommentList" }
  /repos/{owner}/{repo}/issues/{issue_number}/comments:
    get:
      operationId: issues_list_comments
      summary: List conversation comments on an issue or pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
    post:
      operationId: issues_create_comment
      summary: Create a conversation comment
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/issues/comments/{comment_id}:
    patch:
      operationId: issues_update_comment
      summary: Update a conversation comment
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/comment_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/issues/comments/{comment_id}/reactions:
    post:
      operationId: issues_create_reaction
      summary: React to a conversation comment
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/comment_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, enum: ["eyes"] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "201": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/compare/{basehead}:
    get:
      operationId: repos_compare_commits
      summary: Compare two commits
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: basehead
          in: path
          required: true
          description: "<base>...<head>"
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: repos_get_content
      summary: Get a file's contents
      description: >-
        With the Accept header set to application/vnd.github.raw+json, a
        file comes back as its text instead of JSON with base64 content.
        Directories are listed with git_get_tree, not here.
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: path
          in: path
          required: true
          schema: { type: string }
        - name: ref
          in: query
          schema: { type: string }
        # OpenAPI 3.0 says a header parameter named Accept is ignored, so
        # the raw media type is also declared on the 200 response below.
        # Which one Guild honors is checked before merge (quickstart step 2).
        - name: Accept
          in: header
          required: false
          schema: { type: string, enum: ["application/vnd.github.raw+json"] }
      responses:
        "200":
          description: >-
            A file as JSON with base64 content, or as its text with the raw
            media type.
          content:
            application/json:
              schema: { type: object }
            application/vnd.github.raw+json:
              schema: { type: string }
  /repos/{owner}/{repo}/git/trees/{tree_sha}:
    get:
      operationId: git_get_tree
      summary: List one directory's entries with sizes
      description: >-
        tree_sha is "<commit>:<directory>", or a commit SHA for the root.
        Entries carry path, mode, type, sha and size; mode 120000 is a
        symlink. Never recursive.
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: tree_sha
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/branches/{branch}:
    get:
      operationId: repos_get_branch
      summary: Get a branch, with its required status checks
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: branch
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/rules/branches/{branch}:
    get:
      operationId: repos_get_branch_rules
      summary: List the ruleset rules that apply to a branch
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: branch
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/commits/{ref}/check-runs:
    get:
      operationId: checks_list_for_ref
      summary: List check runs with one name for a commit
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - name: check_name
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/commits/{ref}/status:
    get:
      operationId: repos_get_combined_status
      summary: Get the combined commit status for a commit
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /repos/{owner}/{repo}/issues/{issue_number}/labels:
    post:
      operationId: issues_add_labels
      summary: Add the pending label to an issue or pull request
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels:
                  type: array
                  items: { type: string, enum: ["lfx-review-agent-pending"] }
      responses:
        "200": { $ref: "#/components/responses/OkList" }
  /repos/{owner}/{repo}/issues/{issue_number}/labels/lfx-review-agent-pending:
    delete:
      operationId: issues_remove_label
      summary: Remove the pending label from an issue or pull request
      description: >-
        Returns 404 when the label is not on the issue. The label name is
        part of the path, so this operation cannot remove any other label.
      parameters:
        - $ref: "#/components/parameters/owner"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/issue_number"
      responses:
        "200": { $ref: "#/components/responses/OkList" }
        "404": { $ref: "#/components/responses/Ok" }
  /search/issues:
    get:
      operationId: search_issues
      summary: Search issues and pull requests
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [created, updated] }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /users/{username}:
    get:
      operationId: users_get_by_username
      summary: Get a user by login
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
